<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Vela – Nachrichten & Wetter</title><style>body{font-family:system-ui;margin:0;background:#07152f;color:#f7f9ff}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#102449;border:1px solid #29436f;border-radius:18px;padding:20px;margin:12px 0}.muted{color:#aebbd2}.row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #29436f}.row:last-child{border-bottom:0}.time{font-weight:800}.badge{color:#ffad3d;font-weight:800}@media(max-width:560px){.row{display:block}.time{margin-bottom:4px}}</style></head><body><main class="wrap"><h1>📰 Nachrichten & Wetter</h1><p class="muted">Tatsächliche Startzeiten laut laut.fm – 10.08.2026 bis 16.08.2026.</p><section class="card"><div id="status" class="muted">Archiv wird geladen …</div><div id="list"></div></section></main><script>async function load(){try{const r=await fetch('./news-and-weather.json?'+Date.now());const data=await r.json();const list=document.getElementById('list');if(!data.length){document.getElementById('status').textContent='Noch keine bestätigte Ausstrahlung erfasst.';return}document.getElementById('status').textContent=data.length+' Ausstrahlungen erfasst.';list.innerHTML=data.slice().reverse().map(x=>{const d=new Date(x.played_at);return `<div class="row"><div><div class="time">${d.toLocaleDateString('de-DE')} · ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} Uhr</div><div class="muted">${x.title||'Nachrichten & Wetter'}</div></div><div class="badge">BESTÄTIGT</div></div>`}).join('')}catch(e){document.getElementById('status').textContent='Archiv konnte nicht geladen werden.'}}load();</script></body></html>
