<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Radio Vela</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#07152f;font-family:system-ui;color:#f7f9ff}body{overflow:auto}.home{position:relative;width:100%;min-height:100vh}.home iframe{display:block;width:100%;height:100vh;min-height:760px;border:0;background:#07152f}.playlistButton{position:fixed;top:18px;right:18px;z-index:20;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 17px;background:linear-gradient(135deg,#ff7a18,#ffad3d);color:#15100a;font-weight:900;cursor:pointer;box-shadow:0 8px 28px #0006}.panel{display:none;min-height:100vh;padding:22px 18px 42px;box-sizing:border-box;background:linear-gradient(145deg,#07152f,#0b1f43 55%,#081326)}.panel.show{display:block}.box{max-width:920px;margin:auto;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.09);padding:22px;box-shadow:0 18px 50px #0004}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:900;font-size:2rem;letter-spacing:-.05em}.brand span{color:#ff7a18}.muted{color:#aebbd2;font-size:.9rem;line-height:1.5;margin-top:6px}.select{width:100%;margin-top:18px;padding:12px 14px;border-radius:14px;background:#07152f;color:#f7f9ff;border:1px solid rgba(255,255,255,.14);font-size:1rem;font-weight:700}.back{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 15px;background:#0003;color:#f7f9ff;font-weight:800;cursor:pointer}.list{display:grid;gap:9px;margin-top:14px}.track{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:#0002}.num{width:32px;color:#ffad3d;font-weight:900}.main{min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:.86rem;color:#aebbd2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-left:auto;color:#ffad3d;font-weight:800;white-space:nowrap;font-size:.9rem}.empty{color:#aebbd2;padding:12px 0}.error{color:#ffc1b5}.day{margin-top:14px}.day h3{margin:0}@media(max-width:600px){.playlistButton{top:10px;right:10px;padding:9px 13px;font-size:.9rem}.home iframe{min-height:720px}.panel{padding:12px}.box{padding:16px;border-radius:20px}.track{gap:8px}.time{font-size:.8rem}}
</style>
</head>
<body>
<div id="home" class="home">
  <iframe id="homepage" src="./index.html" title="Radio Vela Startseite"></iframe>
  <button id="open" class="playlistButton">Playlist</button>
</div>
<div id="panel" class="panel">
  <section class="box">
    <div class="top"><div><div class="brand">Radio <span>Vela</span></div><div class="muted">Die bestehende Radio-Vela-Homepage bleibt vollständig unverändert. Die Playlist ist nur als zusätzliche Ansicht ergänzt.</div></div><button id="back" class="back">← Startseite</button></div>
    <select id="days" class="select"></select>
    <div id="content"><div class="empty">Playlist wird geladen …</div></div>
  </section>
</div>
<script>
const HISTORY='./history.json';
const START_KEY='radioVelaPlaylistStartFinal';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function artist(x){return typeof x==='string'?x:(x&&x.name)||''}
function ts(x){const v=x?.played_at||x?.started_at;if(!v)return 0;const t=Date.parse(String(v).replace(' ','T'));return Number.isNaN(t)?0:t}
function time(x){const t=ts(x);return t?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Berlin'}):'—'}
function dayKey(x){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ts(x)))}
function label(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function norm(x){if(!x||!x.title)return null;return{title:String(x.title),artist:artist(x.artist),played_at:x.played_at||x.started_at||''}}
function getStart(){let v=localStorage.getItem(START_KEY);if(!v){v=new Date().toISOString();localStorage.setItem(START_KEY,v)}return Date.parse(v)}
const START=getStart();let entries=[];
async function load(){try{const r=await fetch(HISTORY+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();entries=(Array.isArray(d)?d:[]).map(norm).filter(x=>x&&ts(x)>=START).sort((a,b)=>ts(a)-ts(b));renderDays()}catch(e){document.getElementById('content').innerHTML='<div class="empty error">Die gespeicherte Playlist konnte gerade nicht geladen werden.</div>';console.error(e)}}
function renderDays(){const s=document.getElementById('days');const first=new Date(START),today=new Date();const days=[];let d=new Date(first.getFullYear(),first.getMonth(),first.getDate());for(let i=0;i<7&&d<=today;i++){days.push(new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d));d.setDate(d.getDate()+1)}const old=s.value;s.innerHTML=days.map(x=>`<option value="${x}">${label(x)}</option>`).join('');if(days.includes(old))s.value=old;draw(s.value||days[0])}
function draw(day){if(!day)return;const arr=entries.filter(x=>dayKey(x)===day).sort((a,b)=>ts(a)-ts(b));document.getElementById('content').innerHTML=`<div class="day"><h3>${label(day)} · ${arr.length} Einträge</h3>${arr.length?'<div class="list">'+arr.map((x,i)=>`<div class="track"><div class="num">${i+1}</div><div class="main"><div class="title">${esc(x.title)}</div><div class="artist">${esc(x.artist)}</div></div><div class="time">${time(x)}</div></div>`).join('')+'</div>':'<div class="empty">Noch keine Einträge für diesen Tag. Die Liste wächst automatisch weiter.</div>'}</div>`}
function showPlaylist(){document.getElementById('home').style.display='none';document.getElementById('panel').classList.add('show');load()}
function showHome(){document.getElementById('panel').classList.remove('show');document.getElementById('home').style.display='block'}
document.getElementById('open').onclick=showPlaylist;document.getElementById('back').onclick=showHome;document.getElementById('days').onchange=e=>draw(e.target.value);
load();setInterval(load,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});window.addEventListener('pageshow',load);window.addEventListener('online',load);
</script>
</body>
</html>
