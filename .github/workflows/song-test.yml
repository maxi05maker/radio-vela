name: Radio Vela – 24h Song-Test

on:
  workflow_dispatch:
  schedule:
    # Alle 5 Minuten. Die zeitliche Begrenzung erfolgt im Script in Europe/Berlin.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: radio-vela-song-test
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Playlist erfassen und Auswertung führen
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BERLIN = ZoneInfo('Europe/Berlin')
          API = 'https://api.laut.fm/station/radio-vela/last_songs'
          PERIOD_START = datetime(2026, 8, 10, 23, 0, 0, tzinfo=BERLIN)
          PERIOD_END = datetime(2026, 8, 11, 23, 0, 0, tzinfo=BERLIN)
          now = datetime.now(BERLIN)

          DATA_PATH = 'archive/song-test-2026-08-10.json'
          MD_PATH = 'archive/song-test-2026-08-10.md'

          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      value = json.load(f)
                  return value if isinstance(value, type(default)) else default
              except Exception:
                  return default

          data = load(DATA_PATH, {'occurrences': [], 'winner': None})
          occurrences = data.get('occurrences', [])
          known = {x.get('played_at') for x in occurrences if isinstance(x, dict)}

          # Nach Ende des Tests nichts Neues mehr aufnehmen, aber die Auswertung noch
          # bis zum nächsten GitHub-Lauf durchführen können.
          if now < PERIOD_START:
              print(f'Noch nicht gestartet: {now.isoformat()}')
              raise SystemExit(0)

          songs = []
          if now <= PERIOD_END:
              req = urllib.request.Request(API, headers={'User-Agent': 'Radio-Vela-24h-Song-Test'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          raw = json.load(r)
                      songs = raw if isinstance(raw, list) else raw.get('items', [])
                      break
                  except Exception as exc:
                      if attempt == 2:
                          print(f'laut.fm-Abfrage fehlgeschlagen: {exc}')
                      else:
                          time.sleep(3)

          added = 0
          for song in songs:
              if not isinstance(song, dict):
                  continue
              played_at = song.get('started_at') or song.get('start_time') or song.get('played_at')
              title = str(song.get('title') or '').strip()
              artist = song.get('artist') or ''
              if isinstance(artist, dict):
                  artist = artist.get('name', '')
              artist = str(artist).strip()
              if not played_at or not title:
                  continue

              try:
                  dt = datetime.strptime(str(played_at), '%Y-%m-%d %H:%M:%S %z').astimezone(BERLIN)
              except ValueError:
                  continue

              if not (PERIOD_START <= dt <= PERIOD_END):
                  continue
              key = dt.isoformat()
              if key in known:
                  continue

              occurrences.append({
                  'played_at': key,
                  'title': title,
                  'artist': artist
              })
              known.add(key)
              added += 1

          occurrences.sort(key=lambda x: x.get('played_at', ''))

          # Anzahl je Titel + Interpret. Die einzelnen Vorkommen bleiben trotzdem
          # separat gespeichert, damit die Reihenfolge und tatsächlichen Zeiten sichtbar bleiben.
          counts = {}
          for x in occurrences:
              key = (x.get('artist', '').casefold(), x.get('title', '').casefold())
              counts[key] = counts.get(key, 0) + 1

          winner = data.get('winner')
          if now >= PERIOD_END and not winner:
              if counts:
                  max_count = max(counts.values())
                  leaders = []
                  for key, count in counts.items():
                      if count == max_count:
                          leaders.append(key)
                  winner = {
                      'status': 'gekürt',
                      'count': max_count,
                      'songs': [
                          {'artist': next(x['artist'] for x in occurrences if (x['artist'].casefold(), x['title'].casefold()) == key),
                           'title': next(x['title'] for x in occurrences if (x['artist'].casefold(), x['title'].casefold()) == key)}
                          for key in leaders
                      ],
                      'decided_at': now.isoformat()
                  }
              else:
                  winner = {'status': 'keine Titel erfasst', 'count': 0, 'songs': [], 'decided_at': now.isoformat()}

          data = {'period_start': PERIOD_START.isoformat(), 'period_end': PERIOD_END.isoformat(), 'occurrences': occurrences, 'winner': winner}

          with open(DATA_PATH, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')

          # Gut lesbare Liste: jedes tatsächliche Vorkommen steht einzeln untereinander.
          seen_numbers = {}
          lines = [
              '# Radio Vela – 24h Song-Test',
              '',
              f'Zeitraum: **10.08.2026, 23:00 Uhr – 11.08.2026, 23:00 Uhr**',
              '',
              'Jedes tatsächlich erkannte Abspielen steht einzeln. Bei Wiederholungen wird die laufende Anzahl dieses Liedes angegeben.',
              '',
              '## Playlist',
              ''
          ]
          for i, x in enumerate(occurrences, 1):
              key = (x['artist'].casefold(), x['title'].casefold())
              seen_numbers[key] = seen_numbers.get(key, 0) + 1
              suffix = f" ({seen_numbers[key]})" if seen_numbers[key] > 1 else ''
              t = datetime.fromisoformat(x['played_at']).strftime('%d.%m.%Y %H:%M:%S Uhr')
              lines.append(f"{i}. **{x['title']}** – {x['artist']} · {t}{suffix}")

          lines += ['', '## Meistgespieltes Lied', '']
          if winner:
              if winner['songs']:
                  for w in winner['songs']:
                      lines.append(f"🏆 **{w['title']}** – {w['artist']} · **{winner['count']}×**")
                  lines.append(f"Gekürt am {datetime.fromisoformat(winner['decided_at']).strftime('%d.%m.%Y %H:%M:%S Uhr')}")
              else:
                  lines.append('Keine Titel wurden erfasst.')
          else:
              lines.append('Noch nicht gekürt. Die Auswertung erfolgt nach Ablauf des 24-Stunden-Tests.')
          lines += ['', f'Letztes Update: {now.strftime("%d.%m.%Y %H:%M:%S Uhr")}']

          with open(MD_PATH, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')

          subprocess.run(['git', 'config', 'user.name', 'Radio Vela Song Test'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', DATA_PATH, MD_PATH], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              subprocess.run(['git', 'commit', '-m', '24h Song-Test aktualisieren'], check=True)
              subprocess.run(['git', 'push'], check=True)

          print(f'{now.isoformat()} – +{added} Titel, insgesamt {len(occurrences)} Vorkommen')
          if winner:
              print(f"Gewinner: {winner['songs']} mit {winner['count']}x")
          PY
