name: Radio Vela – nur Nachrichten

on:
  workflow_dispatch:
  schedule:
    # Einmal pro Stunde. Der Code selbst begrenzt den Testzeitraum.
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: radio-vela-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Nachrichten filtern
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BERLIN = ZoneInfo('Europe/Berlin')
          API = 'https://api.laut.fm/station/radio-vela/last_songs'
          PERIOD_START = datetime(2026, 8, 10, 22, 0, 0, tzinfo=BERLIN)
          PERIOD_END = datetime(2026, 8, 16, 23, 59, 59, tzinfo=BERLIN)

          now = datetime.now(BERLIN)

          # Außerhalb des gewünschten Zeitraums wird nichts verändert.
          if now < PERIOD_START or now > PERIOD_END:
              print(f'Außerhalb des Testzeitraums: {now.isoformat()}')
              raise SystemExit(0)

          try:
              with open('news.json', encoding='utf-8') as f:
                  news = json.load(f)
              if not isinstance(news, list):
                  news = []
          except Exception:
              news = []

          known = {x.get('played_at') for x in news if isinstance(x, dict)}

          req = urllib.request.Request(API, headers={'User-Agent': 'Radio-Vela-News'})
          songs = []
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  songs = data if isinstance(data, list) else data.get('items', [])
                  break
              except Exception as exc:
                  if attempt == 2:
                      print(f'laut.fm-Abfrage fehlgeschlagen: {exc}')
                  else:
                      time.sleep(3)

          added = 0
          for song in songs:
              if not isinstance(song, dict):
                  continue

              title = str(song.get('title') or '').strip().casefold()
              artist = song.get('artist') or ''
              if isinstance(artist, dict):
                  artist = artist.get('name', '')
              artist = str(artist).strip().casefold()
              played_at = song.get('started_at')

              if title != 'nachrichten & wetter' or artist != 'laut.fm' or not played_at:
                  continue

              try:
                  played_dt = datetime.strptime(str(played_at), '%Y-%m-%d %H:%M:%S %z').astimezone(BERLIN)
              except ValueError:
                  continue

              if not (PERIOD_START <= played_dt <= PERIOD_END):
                  continue

              if played_at not in known:
                  news.append({
                      'played_at': str(played_at),
                      'title': 'Nachrichten & Wetter',
                      'artist': 'laut.fm'
                  })
                  known.add(played_at)
                  added += 1

          news.sort(key=lambda x: x.get('played_at', ''))

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['git', 'config', 'user.name', 'Radio Vela Nachrichten'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'news.json'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              subprocess.run(['git', 'commit', '-m', 'Nachrichtenzeit aktualisieren'], check=True)
              subprocess.run(['git', 'push'], check=True)

          print(f'{now.strftime("%d.%m.%Y %H:%M:%S")} – +{added} Nachrichten, insgesamt {len(news)}')
          PY
