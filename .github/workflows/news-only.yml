name: Radio Vela – nur Nachrichten

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: radio-vela-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Nachrichten prüfen
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          BERLIN = ZoneInfo('Europe/Berlin')
          now = datetime.now(BERLIN)

          # Neuer Wochenzeitraum: Montag 19:00 Uhr bis zum Ende der Woche.
          # Vor dem nächsten Montag 19:00 Uhr werden nur Nachrichten des
          # aktuellen Wochenzeitraums gespeichert. Am Montag vor 19:00 Uhr
          # wird die Liste einmalig zurückgesetzt.
          monday = (now - timedelta(days=now.weekday())).replace(hour=19, minute=0, second=0, microsecond=0)
          period_start = monday

          try:
              with open('news.json', encoding='utf-8') as f:
                  news = json.load(f)
          except Exception:
              news = []
          if not isinstance(news, list):
              news = []

          # Am Wochenwechsel vor Montag 19:00 Uhr alte Liste zurücksetzen.
          if now.weekday() == 0 and now < monday:
              news = []
              period_start = monday

          url = 'https://api.laut.fm/station/radio-vela/last_songs'
          req = urllib.request.Request(url, headers={'User-Agent': 'Radio-Vela-News'})
          data = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(3)

          songs = data if isinstance(data, list) else data.get('items', [])
          known = {x.get('played_at') for x in news if isinstance(x, dict)}

          for song in songs:
              if not isinstance(song, dict):
                  continue
              title = str(song.get('title') or '').strip().lower()
              artist = song.get('artist') or ''
              if isinstance(artist, dict):
                  artist = artist.get('name', '')
              artist = str(artist).strip().lower()
              played_at = song.get('started_at')

              if title != 'nachrichten & wetter' or artist != 'laut.fm' or not played_at:
                  continue

              try:
                  played_dt = datetime.strptime(played_at, '%Y-%m-%d %H:%M:%S %z').astimezone(BERLIN)
              except ValueError:
                  continue

              if played_dt < period_start or played_dt > now + timedelta(minutes=1):
                  continue

              if played_at not in known:
                  news.append({
                      'played_at': played_at,
                      'title': 'Nachrichten & Wetter',
                      'artist': 'laut.fm'
                  })
                  known.add(played_at)

          news.sort(key=lambda x: x.get('played_at', ''))

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['git', 'config', 'user.name', 'Radio Vela Nachrichten'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'news.json'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              subprocess.run(['git', 'commit', '-m', 'Nachrichtenzeit aktualisieren'], check=True)
              subprocess.run(['git', 'push'], check=True)

          print(f'Zeitraum ab: {period_start.isoformat()}')
          print(f'Gespeicherte Nachrichten: {len(news)}')
          PY
