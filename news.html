<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Vela – Nachrichtenzeiten</title><style>body{margin:0;background:#061426;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:#0b2948;border-bottom:3px solid #ff7a00;padding:22px 16px;text-align:center}.top h1{margin:0;font-size:28px}.top p{color:#a9bdcf}.nav{text-align:center;padding:14px;background:#071a2d}.nav a{color:#fff;text-decoration:none;border:1px solid #ffffff22;border-radius:20px;padding:8px 14px;margin:4px;display:inline-block}.nav a.active{background:#ff7a00;color:#061426}.wrap{max-width:900px;margin:20px auto;padding:0 13px}.card{background:#ffffff0d;border:1px solid #ffffff18;border-radius:20px;padding:20px;margin-bottom:18px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #ffffff18}.time{font-weight:800;color:#ff7a00}.muted{color:#a9bdcf}.early{color:#ffd36a}.late{color:#ff9b9b}.ontime{color:#9ff0b0}@media(max-width:600px){.row{grid-template-columns:1fr}.row>div{margin-bottom:2px}}</style></head><body><header class="top"><h1>📰 Nachrichtenzeiten</h1><p>Alle Nachrichten & Wetter seit Samstag, 08.08.2026 · 18:59 Uhr</p></header><div class="nav"><a href="archive.html">🎵 Archiv</a><a class="active" href="news.html">📰 Nachrichtenzeiten</a></div><main class="wrap" id="app"><div class="card">Lade Nachrichtenzeiten …</div></main><script>const app=document.getElementById('app');const DATA='https://raw.githubusercontent.com/maxi05maker/radio-vela/main/history.json';const START=Date.parse('2026-08-08T18:59:00+02:00');function parse(v){const d=new Date(v);return Number.isFinite(d.getTime())?d:null}function clock(d){return d.toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit'})}function day(d){return d.toLocaleDateString('de-DE',{timeZone:'Europe/Berlin',weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}function delta(d){const p=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d);const n=x=>Number(p.find(y=>y.type===x)?.value||0);let s=n('minute')*60+n('second');if(n('hour')===24)s=0;if(s>1800)s-=3600;const sign=s>0?'+':s<0?'−':'±';const a=Math.abs(s);return {txt:sign+Math.floor(a/60)+' Min. '+String(a%60).padStart(2,'0')+' Sek.',cls:s>0?'late':s<0?'early':'ontime'}}async function load(){try{const r=await fetch(DATA+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const raw=await r.json();const rows=(Array.isArray(raw)?raw:[]).map(x=>({...x,d:parse(x.played_at)})).filter(x=>x.d&&x.d.getTime()>=START&&String(x.title||'').trim().toLowerCase()==='nachrichten & wetter').sort((a,b)=>a.d-b.d);if(!rows.length){app.innerHTML='<div class="card">Noch keine Nachrichten-Einträge seit 18:59 Uhr gefunden.</div>';return}let html='<div class="card"><h2>📰 Nachrichten & Wetter</h2><p class="muted">'+rows.length+' Einträge seit 18:59 Uhr. Dauerhafte Historie, automatisch aktualisiert.</p>';let lastDay='';for(const x of rows){const dl=day(x.d);if(dl!==lastDay){if(lastDay)html+='</div>';html+='<h3>'+dl+'</h3><div>';lastDay=dl}const d=delta(x.d);const target=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit'}).format(x.d)+':00';html+='<div class="row"><div><span class="time">'+clock(x.d)+'</span></div><div class="muted">Soll: '+target+'</div><div class="'+d.cls+'">'+d.txt+'</div></div>'}html+='</div></div>';app.innerHTML=html}catch(e){app.innerHTML='<div class="card">Fehler beim Laden des Archivs: '+e.message+'</div>'}}load();setInterval(load,60000);</script></body></html>
