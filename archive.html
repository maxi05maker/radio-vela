<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2948"><title>Radio Vela – Archiv</title><style>:root{--b:#0b2948;--b2:#103d67;--o:#ff7a00;--m:#a9bdcf;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;background:#061426;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{background:linear-gradient(135deg,var(--b),var(--b2));border-bottom:3px solid var(--o);padding:22px 16px;text-align:center}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--m)}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:#071a2d}nav a{color:#fff;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px}nav a.active{background:var(--o);border-color:var(--o);color:#061426;font-weight:900}main{width:min(900px,calc(100% - 26px));margin:20px auto}.day,.stats{background:linear-gradient(180deg,#ffffff12,#ffffff08);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 15px 45px #0003}.dayhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.dayhead h2,.stats h2{margin:0;font-size:19px}.badge{color:var(--o);font-weight:900;font-size:13px}.song{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.song:last-child{border-bottom:0}.time{color:var(--o);font-weight:900}.artist{color:var(--m);font-size:13px;margin-top:2px}.status,.empty,.count,.small{color:var(--m);font-size:13px}.error{color:#ffb4b4}.topcard{margin:14px 0;padding:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff0a}.toplabel{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.topname{font-size:18px;font-weight:900;margin-top:4px}.plays{color:var(--o);font-weight:900;margin-top:3px}.statrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.statrow:last-child{border-bottom:0}.rank{color:var(--o);font-weight:900;margin-right:7px}.live{font-size:12px;color:#9ff0b0;font-weight:800}@media(max-width:600px){.song{grid-template-columns:58px 1fr}.dayhead{align-items:flex-start;flex-direction:column;gap:5px}}</style></head><body><header class="top"><h1>📻 Radio Vela</h1><p>Musikarchiv & Tagesstatistik · <span class="live">● Live-Abgleich</span></p></header><nav><a class="active" href="archive.html">🎵 Archiv</a><a href="news.html">📰 Nachrichtenzeiten</a></nav><main id="archive"><section class="day"><div class="status">Lade Archiv …</div></section></main><script>const root=document.getElementById('archive'),tz='Europe/Berlin',API='https://api.github.com/repos/maxi05maker/radio-vela/contents/archive',RAW='https://raw.githubusercontent.com/maxi05maker/radio-vela/main/',CURRENT=RAW+'history.json',STATS=RAW+'stats.json';function parseDate(v){if(typeof v!=='string'||!v.trim())return null;let d=new Date(v);return Number.isFinite(d.getTime())?d:null}function dayKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}function dayLabel(k){const p=k.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2],12)).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'})}function time(d){return d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:tz})}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statsForDay(all,k){let best=null;for(const st of all){if(!st?.period_start||!st?.period_end)continue;const s=parseDate(st.period_start),e=parseDate(st.period_end);if(!s||!e||e>new Date()||dayKey(s)!==k)continue;if(!best||e>parseDate(best.period_end))best=st}return best}async function json(url){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function load(){try{const files=await json(API);const archiveFiles=files.filter(x=>x.type==='file'&&/^(history|stats)-\d{4}-\d{2}-\d{2}\.json$/.test(x.name));const historyUrls=[CURRENT,...archiveFiles.filter(x=>x.name.startsWith('history-')).map(x=>RAW+'archive/'+x.name)];const statsUrls=[STATS,...archiveFiles.filter(x=>x.name.startsWith('stats-')).map(x=>RAW+'archive/'+x.name)];const [hs,ss]=await Promise.all([Promise.all(historyUrls.map(json)),Promise.all(statsUrls.map(json))]);const data=hs.flatMap(x=>Array.isArray(x)?x:[]),stats=ss.flatMap(x=>x&&typeof x==='object'&&!Array.isArray(x)?Object.values(x):[]),groups={};for(const x of data){const d=parseDate(x?.played_at);if(!d||!x?.title)continue;(groups[dayKey(d)]??=[]).push({...x,_date:d})}const days=Object.keys(groups).sort().reverse();if(!days.length){root.innerHTML='<section class="day"><div class="empty">Noch keine Titel im Archiv.</div></section>';return}root.innerHTML=days.map(k=>{const rows=groups[k].sort((a,b)=>a._date-b._date),st=statsForDay(stats,k);let sh='';if(st){const top=st.top_song;sh='<section class="stats"><h2>📊 Statistik</h2>'+(top?'<div class="topcard"><div class="toplabel">🏆 Top-Song</div><div class="topname">'+esc(top.title)+'</div><div class="artist">'+esc(top.artist)+'</div><div class="plays">'+top.plays+'× gespielt</div></div>':'<div class="empty">Keine Musikstücke in diesem Zeitraum.</div>');if(Array.isArray(st.songs))sh+='<div class="small">Alle Songs nach Anzahl der Plays</div>'+st.songs.map((x,i)=>'<div class="statrow"><div><span class="rank">'+(i+1)+'.</span><b>'+esc(x.title)+'</b><div class="artist">'+esc(x.artist)+'</div></div><b>'+x.plays+'×</b></div>').join('');sh+='</section>'}return '<section class="day"><div class="dayhead"><h2>🎵 '+dayLabel(k)+'</h2><span class="badge">'+rows.length+' Einträge</span></div>'+rows.map(x=>'<div class="song"><div class="time">'+time(x._date)+'</div><div><b>'+esc(x.title)+'</b><div class="artist">'+esc(x.artist)+'</div></div></div>').join('')+'</section>'+sh}).join('')}catch(e){console.error(e);root.innerHTML='<section class="day"><div class="error">Tagesarchiv konnte nicht geladen werden.</div><div class="count">Fehler: '+esc(e.message)+'</div></section>'}}load();setInterval(load,60000);</script></body></html>
