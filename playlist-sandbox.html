<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Radio Vela – Playlist Sandbox</title><style>:root{--b:#07152f;--o:#ff7a18;--o2:#ffad3d;--t:#f7f9ff;--m:#aebbd2;--c:rgba(255,255,255,.09);--l:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(145deg,var(--b),#0b1f43 55%,#081326);color:var(--t);min-height:100vh}.wrap{max-width:920px;margin:auto;padding:22px 18px 42px}.hero,.card{border:1px solid var(--l);border-radius:24px;background:var(--c);padding:22px;box-shadow:0 18px 50px #0004}.hero{background:linear-gradient(135deg,#0d2b61f2,#07152ff2);padding:28px 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(2.2rem,8vw,4.5rem);letter-spacing:-.05em}.brand span{color:var(--o)}.claim{color:var(--m);margin:8px 0 18px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid var(--l);border-radius:999px;padding:10px 15px;background:#0003;color:var(--t);font-weight:800;cursor:pointer}nav button.active{background:linear-gradient(135deg,var(--o),var(--o2));color:#15100a;border-color:transparent}.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}.list{display:grid;gap:9px}.track{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:#0002}.num{width:25px;color:var(--o2);font-weight:900}.main{min-width:0}.title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:.86rem;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-left:auto;color:var(--o2);font-weight:800;white-space:nowrap;font-size:.9rem}.muted{color:var(--m);font-size:.85rem}.playlist{display:none;margin-top:18px}.playlist.show{display:block}.day{border-top:1px solid var(--l);padding:16px 0}.day:first-child{border-top:0}.day h3{margin:0 0 12px}select{width:100%;background:#07152f;border-radius:14px;font-size:1rem}.foot{text-align:center;color:var(--m);font-size:.78rem;margin-top:18px}</style></head><body><div class="wrap"><section class="hero"><div class="top"><div><div class="brand">Radio <span>Vela</span></div><div class="claim">Deine Musik. Deine Region.</div></div><nav><button id="home" class="active">Startseite</button><button id="pl">Playlist</button></nav></div></section><section id="homeView"><div class="grid"><section class="card"><h2>🎵 Letzte 10 Lieder</h2><div id="latest" class="list">Lade Playlist …</div></section><section class="card"><h2>📅 Playlist</h2><p class="muted">Die letzten sieben Tage komplett zurückverfolgen.</p><button id="open">Playlist öffnen</button></section></div></section><section id="playlist" class="playlist"><section class="card"><div class="top"><div><h2>📅 Playlist – letzte 7 Tage</h2><div class="muted">Gespeicherte Musiktitel chronologisch nach Tag.</div></div><button id="back">← Startseite</button></div><div style="margin-top:16px"><select id="days"></select></div><div id="content" style="margin-top:12px">Lade Archiv …</div></section></section><div class="foot">Radio Vela · Sandbox · bestehende Website unverändert</div></div><script>const repo='maxi05maker/radio-vela',raw='https://raw.githubusercontent.com/'+repo+'/main/';function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function artist(x){return typeof x==='string'?x:(x&&x.name)||''}function dt(x){const t=Date.parse(String(x.played_at||x.started_at||'').replace(' ','T'));return Number.isNaN(t)?0:t}function clock(x){return dt(x)?new Date(dt(x)).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Berlin'}):'—'}function music(x){const t=String(x.title||'').toLowerCase(),a=artist(x.artist).toLowerCase();return t&&a!=='jingle'&&a!=='laut.fm'&&t!=='nachrichten & wetter'&&t!=='ganztagsradio'}async function get(u){const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function renderLatest(arr){arr=arr.filter(music).sort((a,b)=>dt(b)-dt(a)).slice(0,10);document.getElementById('latest').innerHTML=arr.length?arr.map((x,i)=>`<div class="track"><div class="num">${i+1}</div><div class="main"><div class="title">${esc(x.title)}</div><div class="artist">${esc(artist(x.artist))}</div></div><div class="time">${clock(x)}</div></div>`).join(''):'Keine Titel verfügbar.'}async function current(){try{const d=await get('https://api.laut.fm/station/radio-vela/last_songs');renderLatest((Array.isArray(d)?d:d.items||[]).map(x=>({played_at:x.started_at,title:x.title,artist:artist(x.artist)})))}catch(e){console.log(e)}}async function seven(){const today=new Date();const days=[];for(let i=0;i<7;i++){const d=new Date(today);d.setDate(today.getDate()-i);days.push(d.toISOString().slice(0,10))}const data={};for(const day of days){try{data[day]=await get(day===days[0]?raw+'history.json':raw+'archive/history-'+day+'.json')}catch(e){data[day]=[]}}const s=document.getElementById('days');s.innerHTML=days.map(d=>`<option value="${d}">${new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</option>`).join('');function draw(day){const a=(data[day]||[]).filter(music).sort((x,y)=>dt(x)-dt(y));document.getElementById('content').innerHTML=a.length?`<div class="day"><h3>${new Date(day+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</h3>${a.map((x,i)=>`<div class="track"><div class="num">${i+1}</div><div class="main"><div class="title">${esc(x.title)}</div><div class="artist">${esc(artist(x.artist))}</div></div><div class="time">${clock(x)}</div></div>`).join('')}</div>`:'Für diesen Tag sind aktuell keine gespeicherten Musiktitel vorhanden.'}s.onchange=()=>draw(s.value);draw(days[0])}function show(){homeView.style.display='none';playlist.classList.add('show');pl.classList.add('active');home.classList.remove('active');seven()}function back(){homeView.style.display='block';playlist.classList.remove('show');home.classList.add('active');pl.classList.remove('active')}pl.onclick=show;open.onclick=show;backBtn=back;document.getElementById('back').onclick=back;current();setInterval(current,20000)</script></body></html>
