name: Radio Vela – Song-Statistik Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radio-vela-song-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Songs erfassen und Statistik aktualisieren
        env:
          START: '2026-08-10T19:00:00+02:00'
          END: '2026-08-11T19:00:00+02:00'
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          from datetime import datetime, timezone

          START = datetime.fromisoformat('2026-08-10T19:00:00+02:00')
          END = datetime.fromisoformat('2026-08-11T19:00:00+02:00')
          API = 'https://api.laut.fm/station/radio-vela/last_songs'

          req = urllib.request.Request(API, headers={'User-Agent': 'Radio-Vela-Song-Statistics'})
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(3)

          songs = data if isinstance(data, list) else data.get('items', [])
          try:
              with open('song-history.json', encoding='utf-8') as f:
                  history = json.load(f)
          except Exception:
              history = []
          if not isinstance(history, list):
              history = []

          known = {x.get('played_at') for x in history if isinstance(x, dict)}

          for song in songs:
              if not isinstance(song, dict):
                  continue
              title = str(song.get('title') or '').strip()
              artist = song.get('artist') or ''
              if isinstance(artist, dict):
                  artist = artist.get('name', '')
              artist = str(artist).strip()
              played_at = song.get('started_at')
              if not title or not played_at:
                  continue
              try:
                  played = datetime.fromisoformat(str(played_at).replace('Z', '+00:00'))
              except Exception:
                  continue
              if played < START or played >= END:
                  continue
              # Nachrichten & Wetter gehört nicht zur Song-Statistik.
              if title.casefold() == 'nachrichten & wetter':
                  continue
              if played_at in known:
                  continue
              history.append({'played_at': played_at, 'title': title, 'artist': artist})
              known.add(played_at)

          history.sort(key=lambda x: x.get('played_at', ''))
          with open('song-history.json', 'w', encoding='utf-8') as f:
              json.dump(history, f, ensure_ascii=False, indent=2)
              f.write('\n')

          # Auswertung für den gesamten Testzeitraum erzeugen.
          counts = {}
          for item in history:
              key = (item.get('title',''), item.get('artist',''))
              counts.setdefault(key, []).append(item.get('played_at'))

          ranked = []
          for (title, artist), times in counts.items():
              ranked.append({
                  'title': title,
                  'artist': artist,
                  'plays': len(times),
                  'played_at': times
              })
          ranked.sort(key=lambda x: (-x['plays'], x['title'].casefold(), x['artist'].casefold()))

          stats = {
              'period': {
                  'start': START.isoformat(),
                  'end': END.isoformat()
              },
              'total_plays': len(history),
              'unique_songs': len(ranked),
              'songs': ranked,
              'status': 'final' if datetime.now(timezone.utc) >= END.astimezone(timezone.utc) else 'running'
          }
          with open('song-stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['git','config','user.name','Radio Vela Song Statistik'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','song-history.json','song-stats.json'], check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode != 0:
              subprocess.run(['git','commit','-m','Song-Statistik aktualisieren'], check=True)
              subprocess.run(['git','push'], check=True)
          print(f'Songs im Testzeitraum: {len(history)}; verschiedene Songs: {len(ranked)}')
          PY
