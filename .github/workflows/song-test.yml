name: Radio Vela – 24h Song-Test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/song-test.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: radio-vela-live-v5
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Echtzeit-Tracker starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          BERLIN=ZoneInfo('Europe/Berlin'); BASE='https://api.laut.fm/station/radio-vela'
          PERIOD_START=datetime(2026,8,10,22,25,0,tzinfo=BERLIN); PERIOD_END=datetime(2026,8,11,22,25,0,tzinfo=BERLIN)
          POLL_SECONDS=5; CHUNK_SECONDS=5*60*60+40*60; HANDOFF_BEFORE=120
          DATA_PATH='archive/song-test-2026-08-10.json'; MD_PATH='archive/song-test-2026-08-10.md'; NEWS_JSON='archive/news-and-weather-2026-08-10.json'; NEWS_MD='archive/news-and-weather-2026-08-10.md'
          def load_json(path,default):
              try:
                  with open(path,encoding='utf-8') as f:return json.load(f)
              except Exception:return default
          def parse_dt(v):
              if not v:return None
              s=str(v).strip()
              for fmt in ('%Y-%m-%d %H:%M:%S %z','%Y-%m-%dT%H:%M:%S%z','%Y-%m-%dT%H:%M:%S.%f%z'):
                  try:return datetime.strptime(s,fmt).astimezone(BERLIN)
                  except ValueError:pass
              try:return datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(BERLIN)
              except ValueError:return None
          def fetch_json(endpoint):
              url=f'{BASE}/{endpoint}?_={time.time_ns()}'
              req=urllib.request.Request(url,headers={'User-Agent':'Radio-Vela-Live-Tracker/5.1','Cache-Control':'no-cache','Pragma':'no-cache'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=8) as r:return json.load(r)
                  except Exception as e:
                      if attempt==2:print(f'{endpoint}: {e}',flush=True)
                      else:time.sleep(1)
              return None
          def normalize(song):
              if not isinstance(song,dict):return None
              title=str(song.get('title') or '').strip(); artist=song.get('artist') or ''
              if isinstance(artist,dict):artist=artist.get('name') or ''
              artist=str(artist).strip(); dt=parse_dt(song.get('started_at') or song.get('start_time') or song.get('played_at'))
              if not title or not dt or not(PERIOD_START<=dt<=PERIOD_END):return None
              return {'played_at':dt.isoformat(),'title':title,'artist':artist}
          def get_candidates():
              raw=fetch_json('current_song'); out=[]
              x=normalize(raw)
              if x:out.append(x)
              if not out:
                  raw=fetch_json('last_songs'); arr=raw if isinstance(raw,list) else ((raw or {}).get('items') or (raw or {}).get('songs') or [])
                  for s in arr:
                      x=normalize(s)
                      if x:out.append(x)
              return out
          def is_news(title):
              t=' '.join(str(title or '').casefold().replace('&',' und ').split());return 'nachrichten' in t and 'wetter' in t
          def write_files(data,news,now):
              with open(DATA_PATH,'w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,indent=2);f.write('\n')
              seen={}; lines=['# Radio Vela – 24h Song-Test','','**Zeitraum:** 10.08.2026, 22:25 Uhr – 11.08.2026, 22:25 Uhr','','## Playlist','']
              for i,x in enumerate(data['occurrences'],1):
                  k=(x['artist'].casefold(),x['title'].casefold());seen[k]=seen.get(k,0)+1;suffix=f' ({seen[k]})' if seen[k]>1 else '';t=datetime.fromisoformat(x['played_at']).strftime('%d.%m.%Y %H:%M:%S Uhr');artist=f" – {x['artist']}" if x['artist'] else '';lines.append(f"{i}. **{x['title']}**{artist} · {t}{suffix}")
              lines += ['', '## Meistgespieltes Lied','','Noch nicht gekürt. Die Auswertung erfolgt nach Ablauf des 24-Stunden-Tests.','',f'Letztes Update: {now.strftime("%d.%m.%Y %H:%M:%S Uhr")}']
              with open(MD_PATH,'w',encoding='utf-8') as f:f.write('\n'.join(lines)+'\n')
              with open(NEWS_JSON,'w',encoding='utf-8') as f:json.dump({'entries':news},f,ensure_ascii=False,indent=2);f.write('\n')
              nl=['# Radio Vela – Nachrichten & Wetter','','## Sendungen','']
              for i,x in enumerate(news,1):nl.append(f"{i}. 📰 **Nachrichten & Wetter** · gespielt: **{datetime.fromisoformat(x['played_at']).strftime('%d.%m.%Y %H:%M:%S Uhr')}** · erkannt: {datetime.fromisoformat(x['detected_at']).strftime('%d.%m.%Y %H:%M:%S Uhr')}")
              if not news:nl.append('Noch keine Sendung erkannt.')
              nl += ['',f'Letztes Update: {now.strftime("%d.%m.%Y %H:%M:%S Uhr")}']
              with open(NEWS_MD,'w',encoding='utf-8') as f:f.write('\n'.join(nl)+'\n')
          def push(message):
              subprocess.run(['git','add',DATA_PATH,MD_PATH,NEWS_JSON,NEWS_MD],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:return
              subprocess.run(['git','config','user.name','Radio Vela Realtime Tracker'],check=True);subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True);subprocess.run(['git','commit','-m',message],check=True)
              for _ in range(5):
                  try:r=subprocess.run(['git','push','origin','HEAD:main'],timeout=20)
                  except subprocess.TimeoutExpired:r=None
                  if r is not None and r.returncode==0:return
                  subprocess.run(['git','fetch','origin','main'],check=True,timeout=20);subprocess.run(['git','rebase','origin/main'],check=True,timeout=20)
              raise RuntimeError('Push fehlgeschlagen')
          def dispatch_next():
              token=os.environ.get('GH_TOKEN')
              if not token:return False
              req=urllib.request.Request('https://api.github.com/repos/maxi05maker/radio-vela/actions/workflows/song-test.yml/dispatches',data=json.dumps({'ref':'main'}).encode(),headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15):return True
              except Exception:return False
          data=load_json(DATA_PATH,{'period_start':PERIOD_START.isoformat(),'period_end':PERIOD_END.isoformat(),'occurrences':[],'winner':None});news=load_json(NEWS_JSON,{'entries':[]}).get('entries',[]);known={x.get('played_at') for x in data.get('occurrences',[]) if isinstance(x,dict)};known_news={x.get('played_at') for x in news if isinstance(x,dict)};started=time.time()
          while True:
              now=datetime.now(BERLIN)
              if now<PERIOD_START:time.sleep(POLL_SECONDS);continue
              if now>=PERIOD_END:break
              if time.time()-started>=CHUNK_SECONDS-HANDOFF_BEFORE:
                  if dispatch_next():break
                  time.sleep(15);continue
              added=False
              for item in get_candidates():
                  key=item['played_at']
                  if key not in known:data['occurrences'].append(item);known.add(key);added=True;print(f"NEUER TITEL: {item['title']} – {item['artist']} · {item['played_at']}",flush=True)
                  if is_news(item['title']) and key not in known_news:news.append({**item,'detected_at':now.isoformat()});known_news.add(key);added=True;print(f"NACHRICHTEN & WETTER: {item['played_at']}",flush=True)
              if added:data['occurrences'].sort(key=lambda x:x['played_at']);news.sort(key=lambda x:x['played_at']);write_files(data,news,now);push('Radio Vela: Live-Archiv aktualisieren [skip ci]')
              time.sleep(POLL_SECONDS)
          now=datetime.now(BERLIN);write_files(data,news,now);push('Radio Vela: Archiv abschliessen [skip ci]')
          PY
