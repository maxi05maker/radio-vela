name: Radio Vela – nur Nachrichten

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: radio-vela-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Nachrichten prüfen
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          from datetime import datetime, timezone

          url = 'https://api.laut.fm/station/radio-vela/last_songs'
          req = urllib.request.Request(url, headers={'User-Agent': 'Radio-Vela-News'})

          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(3)

          songs = data if isinstance(data, list) else data.get('items', [])

          try:
              with open('news.json', encoding='utf-8') as f:
                  news = json.load(f)
          except Exception:
              news = []

          if not isinstance(news, list):
              news = []

          # Neuer Zählzeitraum: 10.08.2026 ab 18:00 Uhr (Deutschland).
          start_local = datetime(2026, 8, 10, 18, 0).astimezone()
          known = {x.get('played_at') for x in news if isinstance(x, dict)}

          for song in songs:
              if not isinstance(song, dict):
                  continue

              title = str(song.get('title') or '').strip().lower()
              artist = song.get('artist') or ''
              if isinstance(artist, dict):
                  artist = artist.get('name', '')
              artist = str(artist).strip().lower()
              played_at = song.get('started_at')

              if title != 'nachrichten & wetter' or artist != 'laut.fm' or not played_at:
                  continue

              try:
                  played_dt = datetime.strptime(played_at, '%Y-%m-%d %H:%M:%S %z')
                  if played_dt.astimezone() < start_local:
                      continue
              except ValueError:
                  continue

              if played_at not in known:
                  news.append({
                      'played_at': played_at,
                      'title': 'Nachrichten & Wetter',
                      'artist': 'laut.fm'
                  })
                  known.add(played_at)

          news.sort(key=lambda x: x.get('played_at', ''))

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(news, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['git', 'config', 'user.name', 'Radio Vela Nachrichten'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'news.json'], check=True)

          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode != 0:
              subprocess.run(['git', 'commit', '-m', 'Nachrichtenzeit aktualisieren'], check=True)
              subprocess.run(['git', 'push'], check=True)

          print(f'Gespeicherte Nachrichten: {len(news)}')
          PY
