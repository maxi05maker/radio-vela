<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f">
<title>Radio Vela</title>
<style>
:root{--blue:#07152f;--blue2:#0d2b61;--orange:#ff7a18;--orange2:#ffad3d;--text:#f7f9ff;--muted:#aebbd2;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,var(--blue),#0b1f43 55%,#081326);color:var(--text);min-height:100vh}.wrap{max-width:920px;margin:auto;padding:22px 18px 42px}.hero{border:1px solid var(--line);border-radius:28px;padding:34px 26px 30px;background:linear-gradient(135deg,rgba(13,43,97,.95),rgba(7,21,47,.92));box-shadow:0 18px 50px rgba(0,0,0,.25)}.brand{font-weight:900;font-size:clamp(2.2rem,8vw,4.5rem);letter-spacing:-.05em;line-height:.95}.brand span{color:var(--orange)}.claim{margin:12px 0 25px;color:var(--muted);font-size:1.05rem}.play{border:0;border-radius:999px;padding:15px 25px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#15100a;font-weight:900;font-size:1rem;cursor:pointer}.stop{display:none;margin-left:8px;background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:13px 18px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px;margin-top:18px}@media(max-width:720px){.grid{grid-template-columns:1fr}}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(10px)}h2{font-size:1.05rem;margin:0 0 15px}.list{display:flex;flex-direction:column;gap:9px}.track{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(0,0,0,.14)}.num{width:26px;color:var(--orange2);font-weight:900}.track-main{min-width:0}.track-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-artist{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-time{margin-left:auto;color:var(--orange2);font-size:.85rem;font-weight:750;white-space:nowrap}.weather-main{display:flex;align-items:center;gap:14px}.weather-icon{font-size:2.8rem}.temp{font-size:2rem;font-weight:900}.weather-meta{color:var(--muted);font-size:.9rem;line-height:1.6;margin-top:9px}.location{margin-top:14px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);color:var(--text)}.news-note{text-align:center;padding:18px 8px;color:var(--muted);line-height:1.5}.news-note strong{display:block;color:var(--text);font-size:1rem;margin-bottom:5px}.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:.78rem}.empty{color:var(--muted);padding:8px 0}.error{color:#ffc1b5}
</style></head>
<body><div class="wrap">
<section class="hero"><div class="brand">Radio <span>Vela</span></div><div class="claim">Deine Musik. Deine Region.</div><button class="play" id="play">▶ Radio starten</button><button class="stop" id="stop">■ Stop</button><audio id="player" preload="none"></audio></section>
<div class="grid">
<section class="card"><h2>🎵 Letzte 10 Lieder</h2><div class="list" id="songs"><div class="empty">Lade Playlist …</div></div></section>
<section class="card"><h2>🌤️ Aktuelles Wetter</h2><div id="weather"><div class="empty">Standort auswählen …</div></div><button id="loc" class="play" style="margin-top:14px;padding:11px 16px">📍 Meinen Standort verwenden</button></section>
</div>
<section class="card" style="margin-top:18px"><h2>📰 Nachrichten & Wetter</h2><div class="news-note"><strong>Die Nachrichten laufen zur vollen Stunde.</strong>Hier werden keine weiteren Informationen angezeigt.</div></section>
<div class="foot">Radio Vela · automatisch aktualisiert</div></div>
<script>
const API='https://api.laut.fm/station/radio-vela/';const stream='https://stream.laut.fm/radio-vela';const player=document.getElementById('player');
play.onclick=async()=>{player.src=stream;try{await player.play();play.style.display='none';stop.style.display='inline-block'}catch(e){alert('Der Stream konnte nicht gestartet werden. Bitte noch einmal tippen.')}};stop.onclick=()=>{player.pause();player.removeAttribute('src');player.load();stop.style.display='none';play.style.display='inline-block'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function artistName(a){if(!a)return '';if(typeof a==='string')return a;return a.name||''}
async function loadSongs(){try{const r=await fetch(API+'last_songs?'+Date.now());if(!r.ok)throw Error();const raw=await r.json();const arr=Array.isArray(raw)?raw:(raw.items||[]);const items=arr.slice(0,10);document.getElementById('songs').innerHTML=items.length?items.map((x,i)=>{const d=x.started_at?new Date(x.started_at):null;const t=d&&!isNaN(d)?d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';return `<div class="track"><div class="num">${i+1}</div><div class="track-main"><div class="track-title">${esc(x.title||'Unbekannter Titel')}</div><div class="track-artist">${esc(artistName(x.artist))}</div></div><div class="track-time">${t} Uhr</div></div>`}).join(''):'<div class="empty">Keine Titel verfügbar.</div>'}catch(e){document.getElementById('songs').innerHTML='<div class="empty error">Playlist konnte gerade nicht geladen werden.</div>'}}
const codes={0:['☀️','Klar'],1:['🌤️','Überwiegend klar'],2:['⛅','Teilweise bewölkt'],3:['☁️','Bedeckt'],45:['🌫️','Nebel'],48:['🌫️','Reifnebel'],51:['🌦️','Leichter Nieselregen'],53:['🌦️','Nieselregen'],55:['🌧️','Starker Nieselregen'],61:['🌦️','Leichter Regen'],63:['🌧️','Regen'],65:['🌧️','Starker Regen'],71:['🌨️','Leichter Schnee'],73:['🌨️','Schnee'],75:['❄️','Starker Schnee'],80:['🌦️','Regenschauer'],81:['🌧️','Regenschauer'],82:['⛈️','Starke Regenschauer'],95:['⛈️','Gewitter'],96:['⛈️','Gewitter mit Hagel'],99:['⛈️','Starkes Gewitter']};
async function weather(lat,lon,place){try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&timezone=Europe%2FBerlin`;const r=await fetch(u);if(!r.ok)throw Error();const c=(await r.json()).current;const info=codes[c.weather_code]||['🌡️','Wetter'];document.getElementById('weather').innerHTML=`<div class="weather-main"><div class="weather-icon">${info[0]}</div><div><div class="temp">${Math.round(c.temperature_2m)} °C</div><div>${info[1]}</div></div></div><div class="weather-meta">📍 ${esc(place)}<br>Gefühlt ${Math.round(c.apparent_temperature)} °C · 💧 ${c.relative_humidity_2m}%<br>💨 ${Math.round(c.wind_speed_10m)} km/h</div>`}catch(e){document.getElementById('weather').innerHTML='<div class="empty">Wetter konnte gerade nicht geladen werden.</div>'}}
function loadWeather(){const saved=localStorage.getItem('rv-location');if(saved){const x=JSON.parse(saved);weather(x.lat,x.lon,x.place)}else{document.getElementById('weather').innerHTML='<div class="empty">Bitte deinen Standort auswählen.</div>'}}
loc.onclick=()=>{if(!navigator.geolocation){alert('Dein Browser unterstützt keine Standortabfrage.');return}navigator.geolocation.getCurrentPosition(p=>{const x={lat:p.coords.latitude,lon:p.coords.longitude,place:'Dein aktueller Standort'};localStorage.setItem('rv-location',JSON.stringify(x));weather(x.lat,x.lon,x.place)},()=>alert('Standort konnte nicht abgerufen werden. Bitte Standortzugriff erlauben.'))};
loadSongs();loadWeather();setInterval(loadSongs,30000);setInterval(loadWeather,600000);
</script></body></html>
