<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Vela – Nachrichten</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;background:#f5f5f5;color:#111}h1{margin-bottom:6px}.sub{color:#666;margin-bottom:28px}.card{background:#fff;border-radius:14px;padding:18px 20px;margin:10px 0;box-shadow:0 1px 5px #0001;display:flex;justify-content:space-between;align-items:center}.time{font-size:1.25rem;font-weight:700}.date{color:#777;font-size:.9rem}#status{color:#777;font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<h1>📻 Radio Vela</h1>
<div class="sub">Nachrichten & Wetter – wann liefen sie?</div>
<div id="list">Lade Daten …</div>
<div id="status"></div>
<script>
async function load(){
 try{
  const r=await fetch('news.json?'+Date.now());
  const data=await r.json();
  data.sort((a,b)=>new Date(a.played_at)-new Date(b.played_at));
  document.getElementById('list').innerHTML=data.length?data.map(x=>{const d=new Date(x.played_at);return `<div class="card"><div><div class="time">${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} Uhr</div><div class="date">${d.toLocaleDateString('de-DE')}</div></div><div>Nachrichten & Wetter</div></div>`}).join(''):'Noch keine Nachrichten erfasst.';
  document.getElementById('status').textContent='Automatische Aktualisierung alle 5 Minuten.';
 }catch(e){document.getElementById('list').textContent='Daten konnten gerade nicht geladen werden.';}
}
load();setInterval(load,60000);
</script>
</body>
</html>
